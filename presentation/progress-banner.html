<div id="qpi-banner" aria-hidden="true">
  <div class="qpi-track">
    <div class="qpi-fill"></div>
  </div>
  <div class="qpi-labels"></div>
</div>

<script>
(function () {
  var ready = function (fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      fn();
    }
  };

  ready(function () {
    var banner = document.getElementById('qpi-banner');
    if (!banner || !window.Reveal) return;

    var labelsHost = banner.querySelector('.qpi-labels');
    var fill = banner.querySelector('.qpi-fill');
    var slides = Array.prototype.slice.call(document.querySelectorAll('.reveal .slides > section'));
    var labels = [];

    function normalize(title) {
      if (!title) return '';
      if (title.indexOf('Results:') === 0) return 'Results';
      if (title.indexOf('Appendix:') === 0) return 'Appendix';
      if (title === 'Landing slide') return 'Landing';
      return title;
    }

    function slideTitle(slide) {
      var h2 = slide.querySelector('h2');
      if (h2) return h2.textContent.trim();
      return '';
    }

    slides.forEach(function (slide) {
      var label = normalize(slideTitle(slide));
      if (!label) label = 'Main';
      labels.push(label);
    });

    labelsHost.innerHTML = '';
    labels.forEach(function (label) {
      var span = document.createElement('span');
      span.className = 'qpi-label';
      span.textContent = label;
      span.dataset.name = label;
      labelsHost.appendChild(span);
    });

    function update() {
      var current = Reveal.getCurrentSlide();
      var currentIndex = slides.indexOf(current);
      var pct = slides.length > 1 ? (currentIndex / (slides.length - 1)) * 100 : 0;
      fill.style.width = Math.max(0, pct) + '%';

      var activeLabel = normalize(slideTitle(current));
      if (!activeLabel) activeLabel = 'Main';
      Array.prototype.slice.call(labelsHost.children).forEach(function (node) {
        node.classList.toggle('active', node.dataset.name === activeLabel);
      });
    }

    Reveal.on('ready', update);
    Reveal.on('slidechanged', update);
    update();
  });
})();
</script>
